name: Release

# Pushing a version tag builds the packages and publishes a GitHub Release:
#
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
#
# The tag must match the version in Cargo.toml. A tag with a pre-release part
# (`-beta.1`, `-rc.2`) makes a pre-release, which only the app's Beta update channel
# offers. Each release carries one package per platform —
# `OpenAtelier-<version>-<platform>.zip|.tar.gz` — and `SHA256SUMS.txt`, which the app's
# updater checks downloads against (`crates/app/src/update.rs`). Run by hand
# (workflow_dispatch) it builds the packages as artifacts without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          # The oldest supported Ubuntu, so the program runs on older distributions too.
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml (v$VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE=OpenAtelier-$VERSION-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p oa-app -p oa-cli

      # Windows packages carry ffmpeg and ffprobe (next to the program, where it looks
      # first), so the editor works without installing anything else. A pinned build,
      # checked against its published SHA-256; bump both lines to update it.
      - name: ffmpeg for Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip
          FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
        run: |
          curl -sSL --fail --retry 3 -o ffmpeg.zip "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  ffmpeg.zip" | sha256sum -c -
          mkdir -p ffmpeg && 7z x ffmpeg.zip -offmpeg > /dev/null
          FF=$(dirname "$(find ffmpeg -name ffmpeg.exe | head -1)")
          # The export needs these encoders; fail here rather than in a user's hands.
          for enc in libx264 libx265 libvpx-vp9 prores_ks gif aac; do
            "$FF/ffmpeg.exe" -hide_banner -encoders | grep -qw "$enc" || { echo "::error::the bundled ffmpeg has no $enc encoder"; exit 1; }
          done
          echo "FFMPEG_BIN=$FF" >> "$GITHUB_ENV"
          echo "FFMPEG_ROOT=$(dirname "$FF")" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/$PACKAGE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/oa-app.exe "dist/$PACKAGE/OpenAtelier.exe"
            cp target/release/oa.exe "dist/$PACKAGE/oa.exe"
            cp "$FFMPEG_BIN/ffmpeg.exe" "$FFMPEG_BIN/ffprobe.exe" "dist/$PACKAGE/"
            cp "$FFMPEG_ROOT/LICENSE" "dist/$PACKAGE/ffmpeg-LICENSE.txt"
            {
              echo "ffmpeg.exe and ffprobe.exe are FFmpeg $(basename "$FFMPEG_ROOT"), built by gyan.dev,"
              echo "licensed under the GNU GPL version 3 (see ffmpeg-LICENSE.txt). They're unmodified."
              echo "FFmpeg's source: https://ffmpeg.org/download.html (and https://git.ffmpeg.org/ffmpeg.git)."
              echo "The build's configuration and components: https://www.gyan.dev/ffmpeg/builds/"
            } > "dist/$PACKAGE/ffmpeg-NOTICE.txt"
          else
            cp target/release/oa-app "dist/$PACKAGE/openatelier"
            cp target/release/oa "dist/$PACKAGE/oa"
            # To install it for the user (menu entry, icon): ./install.sh
            cp installer/linux/install.sh installer/linux/openatelier.desktop "dist/$PACKAGE/"
            cp assets/logo-256.png "dist/$PACKAGE/openatelier.png"
            chmod +x "dist/$PACKAGE/openatelier" "dist/$PACKAGE/oa" "dist/$PACKAGE/install.sh"
          fi
          cp LICENSE README.md "dist/$PACKAGE/"
          cp -r plugins "dist/$PACKAGE/plugins"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$PACKAGE.zip" "$PACKAGE" > /dev/null
          else
            tar czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi
          ls -l

      # The Windows installer, from the same folder (installer/openatelier.iss).
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Preinstalled on GitHub's Windows images (Program Files); otherwise installed.
          $find = { @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = & $find
          }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\$env:PACKAGE" "/DOutputDir=$PWD\dist" installer\openatelier.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      # The Linux installer: a .deb for Debian, Ubuntu and their relatives. The program in
      # /opt/openatelier, `openatelier` on the PATH, a menu entry and its icon; apt brings
      # ffmpeg, the sound library and a Vulkan loader with it. Built on the oldest
      # supported Ubuntu, so it installs on anything from Ubuntu 22.04 / Debian 12 on.
      - name: Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Debian versions sort a pre-release before the release with "~".
          DEB_VERSION=${VERSION/-/\~}
          root=dist/deb
          mkdir -p "$root/DEBIAN" "$root/opt" "$root/usr/bin" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/256x256/apps"
          cp -R "dist/$PACKAGE" "$root/opt/openatelier"
          rm -f "$root/opt/openatelier/install.sh"
          ln -s /opt/openatelier/openatelier "$root/usr/bin/openatelier"
          ln -s /opt/openatelier/oa "$root/usr/bin/oa"
          cp installer/linux/openatelier.desktop "$root/usr/share/applications/"
          cp assets/logo-256.png "$root/usr/share/icons/hicolor/256x256/apps/openatelier.png"
          size=$(du -sk "$root" | cut -f1)
          cat > "$root/DEBIAN/control" <<EOF
          Package: openatelier
          Version: $DEB_VERSION
          Section: video
          Priority: optional
          Architecture: amd64
          Installed-Size: $size
          Depends: ffmpeg, libasound2 | libasound2t64, libvulkan1, libc6 (>= 2.35)
          Recommends: mesa-vulkan-drivers, fontconfig
          Maintainer: OpenAtelier contributors <61389990+CNK12321@users.noreply.github.com>
          Homepage: https://github.com/CNK12321/OpenAtelier
          Description: GPU-first video editor
           One timeline for every format (16:9, 9:16, 1:1), effects, titles, captions,
           motion tracking and sound, rendered on the GPU. Free software (AGPL-3.0-or-later).
          EOF
          dpkg-deb --build --root-owner-group "$root" "dist/$PACKAGE.deb"
          dpkg-deb --info "dist/$PACKAGE.deb"
          rm -rf "$root"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenAtelier ${{ github.ref_name }}
          # "v0.1.0-beta.1" and the like are pre-releases (the Beta update channel).
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ### Which file?
            - **Windows:** `…-windows-x64-setup.exe` installs it (no administrator needed). Or unpack `…-windows-x64.zip` anywhere and run `OpenAtelier.exe`. Both include ffmpeg. Windows may warn that the program isn't signed: *More info → Run anyway*.
            - **Ubuntu, Debian, Mint, Pop!_OS…:** `…-linux-x64.deb` — open it with your software installer, or `sudo apt install ./OpenAtelier-…-linux-x64.deb`. It brings ffmpeg with it.
            - **Other Linux:** unpack `…-linux-x64.tar.gz` and run `./install.sh` inside it (installs for you, with a menu entry; `./install.sh --uninstall` removes it). Install `ffmpeg` from your package manager too.
            - `SHA256SUMS.txt` has each file's checksum.
          files: dist/*
