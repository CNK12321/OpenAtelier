[package]
name = "oa-app"
description = "Preview and editing UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oa-app"
path = "src/main.rs"

[dependencies]
oa-time.workspace = true
oa-params.workspace = true
oa-doc.workspace = true
oa-graph.workspace = true
oa-plan.workspace = true
oa-text.workspace = true
oa-gpu.workspace = true
oa-media.workspace = true
oa-audio.workspace = true
oa-export.workspace = true
oa-edit.workspace = true
oa-captions.workspace = true
sha2 = "0.11"
oa-track.workspace = true
wgpu.workspace = true
eframe = "0.36.2"
rfd = "0.17.2"
serde = { workspace = true }
serde_json = { workspace = true }
png = "0.18"
raw-window-handle = "0.6"

# For `#[implement]` (the drop target in drop_in.rs), which names this crate.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Globalization",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Taking drops from browsers (drop_in.rs).
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
]

# The program's icon and version details in Windows (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
